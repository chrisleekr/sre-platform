workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  BUN_INSTALL_CACHE_DIR: ${CI_PROJECT_DIR}/.bun-install-cache
  # The shared build wrapper uses compatible attestation storage for subject-strict registries.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

default:
  image: oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
  interruptible: true
  before_script:
    - apk add --no-cache bash
    - bash scripts/ci/bootstrap.sh
  # Every lane bootstraps from this cache, so every lane reads it and exactly one writes it.
  # Parallel writers of one key overwrite each other's upload for no gain. A job that declares its
  # own cache replaces this list rather than adding to it, so those jobs repeat the entry.
  cache:
    - key:
        files:
          - bun.lock
        prefix: bun
      paths:
        - .bun-install-cache/
      policy: pull

stages:
  - test
  - release

typecheck:
  stage: test
  cache:
    - key:
        files:
          - bun.lock
        prefix: bun
      paths:
        - .bun-install-cache/
      policy: pull
    # Turbo caches only the lanes that run Turbo tasks. The key is per job, so the two never collide.
    - key: turbo-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
      paths:
        - .turbo/
      policy: pull-push
  script:
    - bash scripts/ci/typecheck.sh

lint:
  stage: test
  cache:
    - key:
        files:
          - bun.lock
        prefix: bun
      paths:
        - .bun-install-cache/
      policy: pull-push
  script:
    - bash scripts/ci/lint.sh

guards:
  stage: test
  script:
    - bash scripts/ci/guards.sh

test:
  stage: test
  services:
    - name: docker:29-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
      alias: docker
  variables:
    FF_NETWORK_PER_BUILD: 'true'
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: 'true'
  # The oven/bun image symlinks node to bun; the test gate pins Vitest to real Node. Only the major is pinned:
  # the test gate enforces the >= 22.12 floor; .tool-versions records the version for local tooling.
  before_script:
    - apk add --no-cache bash 'nodejs~24'
    - bash scripts/ci/bootstrap.sh
  script:
    - bash scripts/ci/test.sh

test-ui:
  stage: test
  # Real Node as above, but no dind service and no Docker variable: this lane starts no container.
  before_script:
    - apk add --no-cache bash 'nodejs~24'
    - bash scripts/ci/bootstrap.sh
  script:
    - bash scripts/ci/test-ui.sh

build:
  stage: test
  cache:
    - key:
        files:
          - bun.lock
        prefix: bun
      paths:
        - .bun-install-cache/
      policy: pull
    - key: turbo-${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}
      paths:
        - .turbo/
      policy: pull-push
  script:
    - bash scripts/ci/build.sh

docs:
  stage: test
  image: ghcr.io/astral-sh/uv:0.13.5-python3.12-alpine@sha256:2501529eb49d9f3ad85ed6ea53fb775f84034587f2ea807dd42b01413a383c1e
  before_script:
    - apk add --no-cache bash
  variables:
    UV_CACHE_DIR: ${CI_PROJECT_DIR}/.uv-cache
  cache:
    key:
      files:
        - uv.lock
      prefix: uv-docs
    paths:
      - .uv-cache/
    policy: pull-push
  script:
    - bash scripts/ci/docs.sh

container:
  stage: test
  image: docker:29-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  services:
    - name: docker:29-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  # A merge request publishes the rolling dev tag; the default branch leaves latest to publish-image
  # in the release stage.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        DEV_TAG: dev
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - sh scripts/ci/docker-wait.sh
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE"
  script:
    - GIT_SHA="$CI_COMMIT_SHORT_SHA" sh scripts/ci/docker-build.sh --image sre-platform --tag ci
    - sh scripts/ci/docker-smoke.sh sre-platform:ci
    # amd64 only: a dev tag has no arm64 consumer, and the second build is a cache-warm export.
    # Gate on the pipeline source, not on DEV_TAG being unset: project and group CI/CD variables
    # outrank rules:variables, so a project variable named DEV_TAG would publish dev from the
    # default branch. The dev build writes its own cache ref so it cannot seed a latest build.
    - |
      if [ "$CI_PIPELINE_SOURCE" = 'merge_request_event' ]; then
        GIT_SHA="$CI_COMMIT_SHORT_SHA" sh scripts/ci/docker-build.sh \
          --image "$CI_REGISTRY_IMAGE" \
          --tag "${DEV_TAG:?dev tag missing on a merge request}" \
          --platforms linux/amd64 \
          --cache-ref "$CI_REGISTRY_IMAGE:buildcache-dev" \
          --push
      fi

publish-image:
  stage: release
  image: docker:29-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  services:
    - name: docker:29-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  interruptible: false
  # A present needs list overrides stage ordering, so a job left out of it is not waited for and
  # this job would publish past a gate that never ran. Name every job in the test stage.
  needs:
    - typecheck
    - lint
    - guards
    - test
    - test-ui
    - build
    - docs
    - container
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - sh scripts/ci/docker-wait.sh
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE"
  script:
    - >-
      GIT_SHA="$CI_COMMIT_SHORT_SHA" sh scripts/ci/docker-build.sh
      --image "$CI_REGISTRY_IMAGE"
      --tag latest
      --platforms linux/amd64,linux/arm64
      --push
