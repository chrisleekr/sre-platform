site_name: SRE Intelligence Platform
site_description: Multi-tenant observability, incident triage, and reliability platform
# Without this, MkDocs emits no canonical link tag at all and sitemap.xml builds empty, so the
# published site has nothing for a crawler to follow. It also mounts `mkdocs serve` under this
# URL's path component, which is why local preview lives at /sre-platform/ rather than the root.
site_url: https://chrisleekr.github.io/sre-platform/
strict: true

# `strict` only halts on warnings. MkDocs already defaults `nav.not_found` and `links.not_found` to
# `warn`; `nav.omitted_files` and `links.anchors` default to `info`, so an orphan page or a dead
# anchor would otherwise build green. All four are pinned here so the level is explicit rather than
# inherited, which is what makes the CI docs job an actual navigation and link gate.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

# Partials generated by `bun run docs:gen` and pulled into pages with pymdownx.snippets `--8<--`.
# Excluded from the page tree so they neither build as standalone pages nor trip the
# `nav.omitted_files` check promoted above.
exclude_docs: |
  _generated/

theme:
  name: material
  features:
    # Top-level sections become tabs across the top; their children fill the sidebar.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  # def_list renders the glossary's term/definition pairs.
  - def_list
  # custom_fences renders ```mermaid blocks as diagrams instead of code listings.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # base_path resolves against the working directory, so always run mkdocs from the repo root.
  # check_paths turns a missing snippet into a build failure rather than a silently empty page.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - tables

